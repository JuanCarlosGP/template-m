# Example — headless quality gate for GitLab CI
# Copy to .gitlab-ci.yml or include from this path.

stages:
  - test

e2e-headless:
  stage: test
  image: node:20
  before_script:
    # @azure-devops/mcp configures npm during install; the runner's /root may be read-only.
    - export NPM_CONFIG_USERCONFIG="$CI_PROJECT_DIR/.npmrc"
  script:
    - npm ci
    - npm run check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  # Optional: device job + artifacts reports/ — see docs/CI.md
