# Example — Android emulator E2E for GitHub Actions (no BrowserStack).
# Copy to .github/workflows/e2e-android-emulator.yml (this template already ships one there).
# See docs/CI.md § Device gate.

name: E2E Android emulator

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/e2e-android-emulator.yml'
      - 'maestro/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: e2e-android-emulator
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_APP_ID: com.saucelabs.mydemoapp.android
      DEMO_APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
      MAESTRO_VERSION: '2.6.0'
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_PROVIDER: cursor
      AGENT_MAESTRO_MCP: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install optional agent SDK
        run: |
          if [ -n "$AGENT_API_KEY" ]; then
            npm install --no-save @cursor/sdk
          else
            echo "AGENT_API_KEY not set — triage disabled"
          fi

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          command -v maestro
          maestro --version

      - name: Download APK
        run: |
          mkdir -p build/android
          curl -fsSL -o build/android/demo.apk "$DEMO_APK_URL"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash maestro/scripts/ci/run-android-emulator-e2e.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
